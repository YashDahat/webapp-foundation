# ── TEST profile ─────────────────────────────────────────────────────────────
# In-memory H2 (PostgreSQL compatibility mode) so the full Spring context boots without a real
# Postgres or Docker. Activated by @ActiveProfiles("test") on the security test suite.
spring.datasource.url=jdbc:h2:mem:webappfoundation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Satisfy the fail-fast startup checks (JwtUtil, AdminInitializer) with test-only values.
jwt.secret=test-only-signing-key-at-least-32-bytes-long-000
admin.password=test-admin-pass-123
admin.allow-insecure-default=true

# CORS allowlist under test: exactly one allowed origin so allow/deny can be asserted (TA).
app.cors.allowed-origins=https://allowed.cloudfront.net

# No real payment gateway in tests (DemoPaymentGateway is used); webhook fail-closed is covered by
# RazorpayWebhookFailClosedTest as a focused unit test instead of via the demo-backed endpoint.
razorpay.webhook.allow-unsigned=true
