# ── PROD profile ─────────────────────────────────────────────────────────────
# NO weak defaults. All secrets come from the environment (JWT_SECRET, DB_*, RAZORPAY_*,
# ADMIN_PASSWORD, APP_CORS_ALLOWED_ORIGINS) — ideally injected from SSM / Secrets Manager.
# The app fails fast at startup when a required secret is missing or weak (see JwtUtil,
# AdminInitializer).

# Belt-and-braces: never accept a default admin password or an unsigned webhook in production,
# even if the environment tries to turn them on.
admin.allow-insecure-default=false
razorpay.webhook.allow-unsigned=false
