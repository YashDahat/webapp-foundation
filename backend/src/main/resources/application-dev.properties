# ── DEV profile ──────────────────────────────────────────────────────────────
# Local / docker-compose convenience defaults ONLY. Never active in production — prod sets
# SPRING_PROFILES_ACTIVE=prod, which inherits the strict/empty defaults in application.properties.

# Demo JWT signing key (>= 32 bytes) so local dev runs without setting JWT_SECRET. CHANGE IN PROD.
jwt.secret=${JWT_SECRET:ZGVtby1vbmx5LXNlY3JldC1rZXktZm9yLWxvY2FsLXRlc3RpbmctY2hhbmdlLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQ=}

# Seed the admin with a known password locally; permitted only because this is the dev profile.
admin.password=${ADMIN_PASSWORD:changeme123}
admin.allow-insecure-default=true

# Allow the Vite/CRA dev servers cross-origin.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Accept unsigned webhooks locally (no webhook secret configured in dev).
razorpay.webhook.allow-unsigned=true
