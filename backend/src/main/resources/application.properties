spring.application.name=webappfoundation
server.port=8080
# Active profile: 'dev' (local/docker convenience defaults) unless overridden. Production MUST set
# SPRING_PROFILES_ACTIVE=prod, which carries NO weak defaults and fails fast on missing/weak secrets.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Tolerate a missing/null JSON value for a primitive field (use its default) instead of a 400 — avoids a
# recurring footgun where a Lombok all-args DTO rejects an absent boolean/int on partial or round-tripped payloads.
spring.jackson.deserialization.fail-on-null-for-primitives=false
management.endpoints.web.exposure.include=health,info
# No default: JwtUtil fails fast at startup if unset or < 32 bytes. The dev profile supplies a demo value.
jwt.secret=${JWT_SECRET:}
# Login sessions last 7 days (users stay signed in across browser restarts; token is kept in localStorage).
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
# Short TTL for email challenges / password-reset links (15 min default) — far shorter than access tokens.
jwt.challenge-expiration-ms=${JWT_CHALLENGE_EXPIRATION_MS:900000}
app.security.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# Login throttle: lock an account after N consecutive failures for M minutes (per-account, in-memory).
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}
# CORS allowlist (comma-separated exact origins). Empty = no cross-origin browser access. The dev
# profile defaults this to localhost; prod MUST set APP_CORS_ALLOWED_ORIGINS to the site's origin(s).
# Never a wildcard "*" (credentials are sent).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
# Public base URL used to build links in emails (e.g. the password-reset link).
app.base-url=${APP_BASE_URL:http://localhost:8080}
admin.email=${ADMIN_EMAIL:owner@yourbusiness.com}
admin.phone=${ADMIN_PHONE:+910000000000}
admin.password=${ADMIN_PASSWORD:changeme123}
# Analytics dashboard — business timezone, financial-year start month, target growth over the recent
# weekday pattern (%), and the optional annual revenue goal (absolute ₹; 0 = no goal set).
analytics.zone=${ANALYTICS_ZONE:Asia/Kolkata}
analytics.fy-start-month=${ANALYTICS_FY_START_MONTH:4}
analytics.target-growth-pct=${ANALYTICS_TARGET_GROWTH_PCT:0}
analytics.annual-revenue-target=${ANALYTICS_ANNUAL_REVENUE_TARGET:0}
# No default password: AdminInitializer refuses to seed a blank or known-default password unless
# admin.allow-insecure-default=true (dev profile only).
admin.password=${ADMIN_PASSWORD:}
admin.allow-insecure-default=${ADMIN_ALLOW_INSECURE_DEFAULT:false}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
# Webhook signature verification fails CLOSED: with no secret configured a webhook is rejected,
# unless this is true (dev profile only). Never true in prod.
razorpay.webhook.allow-unsigned=${RAZORPAY_WEBHOOK_ALLOW_UNSIGNED:false}
# S3-compatible object storage (MinIO self-hosted by default; point at AWS S3 by changing these).
s3.endpoint=${S3_ENDPOINT:http://minio:9000}
s3.region=${S3_REGION:us-east-1}
s3.bucket=${S3_BUCKET:media}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.path-style=${S3_PATH_STYLE:true}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
mail.from=${MAIL_FROM:No Reply <no-reply@example.local>}
management.health.mail.enabled=false
